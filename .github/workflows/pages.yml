name: Publish dashboard

# Builds the static dashboard and publishes it to GitHub Pages:
# https://hadas-cafri.github.io/My-New-Job/
# The site contains no data and no secrets: the Airtable token is typed into the page in the browser.
# Runs on every push to main, or by hand (Actions -> Publish dashboard -> Run workflow).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build (served under /My-New-Job)
        run: npm run build
        env:
          BASE_PATH: /My-New-Job
      - run: touch out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
