name: Job pipeline

# Collects jobs, scores them and updates Airtable.
#
# There is NO automatic schedule. Every day around 11:00 Israel time Claude asks the owner whether to
# run, and only after an explicit "yes" it starts this workflow (Run workflow). It can also be started
# by hand: Actions -> Job pipeline -> Run workflow.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Collect and plan only, write nothing"
        type: boolean
        default: false
      lookback:
        description: "How far back to search (week is the normal run and is needed to close missing jobs; day for a light run)"
        type: choice
        options: [week, day]
        default: week

# Never two runs at the same time.
concurrency:
  group: job-pipeline
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run the pipeline
        run: npm run pipeline -- --lookback "${{ inputs.lookback }}" ${{ inputs.dry_run && '--dry-run' || '' }}
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
