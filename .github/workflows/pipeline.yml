name: Job pipeline

# Collects jobs, scores them and updates Airtable, once a day at 11:00 Israel time.
#
# THE SCHEDULE IS OFF UNTIL YOU TURN IT ON. The scheduled runs do nothing unless the repository
# variable PIPELINE_ENABLED is "true" (Settings -> Secrets and variables -> Actions -> Variables).
# Set it only after the secrets are in place and you have approved the cost. Delete it, or set it to
# anything else, to stop the daily run. A manual run (Run workflow) always works.
#
# GitHub's cron is in UTC and Israel's offset changes with daylight saving (+2 / +3), so the workflow
# is triggered at both possible UTC hours and the script skips the one that is not 11:00 locally.
on:
  schedule:
    - cron: "0 8 * * *"   # 11:00 Israel in summer (UTC+3)
    - cron: "0 9 * * *"   # 11:00 Israel in winter (UTC+2)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Collect and plan only, write nothing"
        type: boolean
        default: false
      lookback:
        description: "How far back to search (week for the first run / backfill, day for a light run)"
        type: choice
        options: [week, day]
        default: week

# Never two runs at the same time.
concurrency:
  group: job-pipeline
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    # manual runs always; scheduled runs only when the switch is on
    if: github.event_name == 'workflow_dispatch' || vars.PIPELINE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Run (scheduled)
        if: github.event_name == 'schedule'
        run: npm run pipeline -- --scheduled-guard
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Run (manual)
        if: github.event_name == 'workflow_dispatch'
        run: npm run pipeline -- --lookback "${{ inputs.lookback }}" ${{ inputs.dry_run && '--dry-run' || '' }}
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
